name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=runs/pytest.xml
      - run: python scripts/build_release.py
      - run: python scripts/check_archive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: runs/pytest.xml
          retention-days: 7
