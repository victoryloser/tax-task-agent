[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-agent-harness"
version = "0.1.0"
description = "Persistent financial task agent with audited writes and durable execution"
requires-python = ">=3.11"
dependencies = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "pydantic>=2.10,<3", "streamlit>=1.50,<2", "pandas>=2,<4", "openpyxl>=3.1,<4", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
postgres = ["psycopg[binary]>=3.2,<4"]
tokenizer = ["transformers>=4.50,<5"]

[project.scripts]
tax-agent = "tax_agent.cli:main"

[tool.setuptools.packages.find]
include = ["tax_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
